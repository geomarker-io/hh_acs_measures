    - '51'
    - '53'
    - '54'
    - '55'
    - '56'
    scaffold:
      url: https://www2.census.gov/geo/tiger/GENZ2020/shp/cb_2020_us_tract_500k.zip
      id_column: GEOID
  zcta:
    years: [2021, 2023]
    id: zcta
    vintage: zcta_vintage
    resource: hh_acs_measures_zcta
    vintage_rules:
    - years: [2021, 2023]
      value: '2020'
    notes:
    - years: [2021, 2023]
      text: All supported ACS years use 2020 ZCTA boundaries.
    scaffold:
      url: https://www2.census.gov/geo/tiger/GENZ2020/shp/cb_2020_us_zcta520_500k.zip
      id_column: GEOID20
measures:
  fraction_poverty:
    title: Fraction of People in Poverty
    domain: Socioeconomic
    definition: Fraction of people with income below the poverty level in the past
      12 months, among people for whom poverty status is determined
    units: fraction
    calculation: proportion
    moe_method: ACS subset-proportion formula; ratio fallback for nonpositive radicands;
      component MOEs combined by root-sum-of-squares with the largest MOE retained
      among zero-estimate components
    rounding:
      method: decimal
      digits: 3
    rules:
    - years: [2021, 2023]
      variables: B17001_002
      denominator: B17001_001
    notes: []
  n_children_lt18:
    title: Number of Children
    domain: Population
    definition: Number of children and adolescents < 18 years of age
    units: count
    calculation: count
    moe_method: Root-sum-of-squares for multiple components, retaining the largest
      MOE among zero-estimate components; source MOE for one component
    rounding:
      method: integer
      digits: 0
    rules:
    - years: [2021, 2023]
      variables:
      - B01001_003
      - B01001_004
      - B01001_005
      - B01001_006
      - B01001_027
      - B01001_028
      - B01001_029
      - B01001_030
    notes: []
  n_pop:
    title: Number of Total People
    domain: Population
    definition: Total population.
    units: count
    calculation: count
    moe_method: Root-sum-of-squares for multiple components, retaining the largest
      MOE among zero-estimate components; source MOE for one component
    rounding:
      method: integer
      digits: 0
    rules:
    - years: [2021, 2023]
      variables: B01001_001
    notes: []
  n_household_lt18:
    title: Number of Households With Children
    domain: Population
    definition: Number of households with children or adolescents < 18 years of age
    units: count
    calculation: count
    moe_method: Root-sum-of-squares for multiple components, retaining the largest
