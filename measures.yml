      - B27001_004
      - B27001_007
      - B27001_010
      - B27001_013
      - B27001_016
      - B27001_019
      - B27001_022
      - B27001_025
      - B27001_028
      - B27001_032
      - B27001_035
      - B27001_038
      - B27001_041
      - B27001_044
      - B27001_047
      - B27001_050
      - B27001_053
      - B27001_056
      denominator: B27001_001
    notes: []
  fraction_snap:
